name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run smoke
      - run: npm audit --omit=dev
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
