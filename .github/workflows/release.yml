name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      # Same Developer ID team and secret names as Pitch Doctor / tyraX:
      # Developer ID certificate (.p12) + App Store Connect API key (.p8) for notarization.
      CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      CSC_NAME: 'Pawel Pajak (7L5KF39DAR)' # electron-builder adds the "Developer ID Application:" prefix itself
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: '7L5KF39DAR'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check signing credentials
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret for $name; see docs/releases.md"
              exit 1
            fi
          done
      - name: Write App Store Connect API key
        shell: bash
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          # electron-builder and notarytool both read the key from this path
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build, sign and notarize both apps
        run: npm run build:mac -- --config.forceCodeSigning=true --config.mac.notarize=true
      - name: Verify signed and stapled apps
        shell: bash
        run: |
          for app in dist/mac*/JebToSendIt.app; do
            codesign --verify --deep --strict "$app"
            codesign --display --verbose=4 "$app" 2>&1 | tee /tmp/signature.txt
            grep -q 'TeamIdentifier=7L5KF39DAR' /tmp/signature.txt
            grep -q 'runtime' /tmp/signature.txt
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
      - name: Notarize and verify signed DMGs
        run: npm run notarize:dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
      - name: Remove API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.sha256
            release/*.zip
            release/*.blockmap
            release/*.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
